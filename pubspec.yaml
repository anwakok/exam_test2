name: game
description: "Yu-Gi-Oh Duel Engine - Flutter Offline-First + AI Integration"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Google Fonts
  google_fonts: ^6.1.0

  # UUID
  uuid: ^4.2.1

  # Networking
  dio: ^5.0.0

  # State Management
  flutter_bloc: ^9.1.1

  # Dependency Injection
  get_it: ^9.2.1

  # Database - SQLite
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.0.0

  # Cache - Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Settings
  shared_preferences: ^2.0.15

  # JSON
  json_annotation: ^4.8.0

  # Navigation
  auto_route: ^9.3.0+1

  # OCR
  google_mlkit_text_recognition: ^0.15.1

  # Environment
  flutter_dotenv: ^6.0.0

  # Image
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4

  # Path
  path: ^1.8.3

  # Device Preview for testing
  device_preview: ^1.2.0

  # Equatable
  equatable: ^2.0.5

  # Functional Programming
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

  # Build Runner
  build_runner: ^2.4.6

  # JSON Serializable
  json_serializable: ^6.7.1

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.0

  # Auto Route Generator
  auto_route_generator: ^9.0.0

  # Hive Generator
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/images/
